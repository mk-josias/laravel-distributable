name: Split

on:
  push:
    branches: [main]
    tags: ['v*']

jobs:
  split:
    name: ${{ matrix.prefix }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - { prefix: packages/core, repository: laravel-distributable-modules-core, key: SPLIT_KEY_CORE }
          - { prefix: starter, repository: laravel-distributable-modules-starter, key: SPLIT_KEY_STARTER }

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Each mirror has its own deploy key: GitHub refuses one key on several repositories.
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets[matrix.key] }}

      - name: Push ${{ matrix.prefix }} to mk-josias/${{ matrix.repository }}
        run: |
          split=$(git subtree split --prefix=${{ matrix.prefix }} HEAD)
          remote=git@github.com:mk-josias/${{ matrix.repository }}.git
          if [ "${GITHUB_REF_TYPE}" = tag ]; then
            git push "$remote" "$split:refs/tags/${GITHUB_REF_NAME}"
          else
            git push --force "$remote" "$split:refs/heads/main"
          fi
