name: Publish

on:
  push:
    branches: [main]
    tags: ['v*']

jobs:
  publish:
    name: ${{ matrix.prefix }}
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        include:
          - { prefix: packages/core, repository: laravel-distributable-core, key: SPLIT_KEY_CORE }
          - { prefix: packages/rpc-http, repository: laravel-distributable-rpc-http, key: SPLIT_KEY_RPC_HTTP }
          - { prefix: packages/stream-redis, repository: laravel-distributable-stream-redis, key: SPLIT_KEY_STREAM_REDIS }
          - { prefix: starter, repository: laravel-distributable-starter, key: SPLIT_KEY_STARTER }

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Each mirror has its own deploy key: GitHub refuses one key on several repositories.
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets[matrix.key] }}

      - name: Push ${{ matrix.prefix }} to mk-josias/${{ matrix.repository }}
        run: |
          split=$(git subtree split --prefix=${{ matrix.prefix }} HEAD)
          remote=git@github.com:mk-josias/${{ matrix.repository }}.git
          if [ "${GITHUB_REF_TYPE}" = tag ]; then
            git push "$remote" "$split:refs/tags/${GITHUB_REF_NAME}"
          else
            git push --force "$remote" "$split:refs/heads/main"
          fi

      # The mirrors carry no webhook: Packagist reads the new commit or tag when told.
      - name: Update mk-josias/${{ matrix.repository }} on Packagist
        env:
          PACKAGIST_TOKEN: ${{ secrets.PACKAGIST_TOKEN }}
        run: |
          curl --fail-with-body -sS -X POST https://packagist.org/api/update-package \
            -H "Authorization: Bearer mk-josias:${PACKAGIST_TOKEN}" \
            -H 'Content-Type: application/json' \
            -d '{"repository":"https://github.com/mk-josias/${{ matrix.repository }}"}'
