name: CI

on:
  push:
  pull_request:

jobs:
  core:
    name: Laravel ${{ matrix.laravel }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        laravel: ['12.*', '13.*']

    # Without a reachable Redis, tests/Events/RedisStreamTest.php skips itself.
    services:
      redis:
        image: valkey/valkey:8-alpine
        ports: ['6379:6379']
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 5

    steps:
      - uses: actions/checkout@v4
        with:
          path: distributable

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: redis
          coverage: none

      - name: Install dependencies
        working-directory: distributable
        run: |
          composer require "laravel/framework:${{ matrix.laravel }}" --no-update --no-interaction
          composer update --with-all-dependencies --prefer-dist --no-progress --no-interaction

      - name: Pint, PHPStan, Pest
        working-directory: distributable
        run: composer check

      - name: Example, iam, notifications and analytics behind a Node gateway
        working-directory: distributable
        run: |
          command -v redis-cli > /dev/null || { sudo apt-get update > /dev/null && sudo apt-get install -y redis-tools > /dev/null; }
          examples/run.sh

  starter:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          path: distributable

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - name: Install dependencies
        working-directory: distributable/starter
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Pint, PHPStan, tests
        working-directory: distributable/starter
        run: composer check

  # The same journey with every module in one container, then with one container per module, through Traefik.
  together-or-apart:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        compose: [docker-compose.mono.yml, docker-compose.yml]

    steps:
      - uses: actions/checkout@v4
        with:
          path: distributable

      - name: Journey
        working-directory: distributable/starter
        run: tests/e2e/together-or-apart.sh ${{ matrix.compose }}

  # The gateway's Traefik plugin (starter/gateway/plugins/auth); the journeys above run it in Traefik.
  gateway-plugin:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Plugin tests
        working-directory: starter/gateway/plugins/auth
        run: test -z "$(gofmt -l .)" && go vet ./... && go test ./...
