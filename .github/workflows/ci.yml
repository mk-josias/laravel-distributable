name: CI

on:
  push:
  pull_request:

jobs:
  core:
    name: Laravel ${{ matrix.laravel }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        laravel: ['12.*', '13.*']

    # Without a reachable Redis, tests/Events/RedisStreamTest.php skips itself.
    services:
      redis:
        image: valkey/valkey:8-alpine
        ports: ['6379:6379']
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 5

    steps:
      # composer.json reaches laravel-microservices through path repositories at ../laravel-microservices.
      - uses: actions/checkout@v4
        with:
          path: distributable

      - uses: actions/checkout@v4
        with:
          repository: mk-josias/laravel-microservices
          path: laravel-microservices

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: redis
          coverage: none

      - name: Install dependencies
        working-directory: distributable
        run: |
          composer require "laravel/framework:${{ matrix.laravel }}" --no-update --no-interaction
          composer update --with-all-dependencies --prefer-dist --no-progress --no-interaction

      - name: Pint, PHPStan, Pest
        working-directory: distributable
        run: composer check

  starter:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          path: distributable

      - uses: actions/checkout@v4
        with:
          repository: mk-josias/laravel-microservices
          path: laravel-microservices

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - name: Install dependencies
        working-directory: distributable/starter
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Pint, PHPStan, tests
        working-directory: distributable/starter
        run: composer check

  # The same journey with every module in one container, then with one container per module.
  together-or-apart:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        compose: [docker-compose.mono.yml, docker-compose.yml]

    steps:
      - uses: actions/checkout@v4
        with:
          path: distributable

      - uses: actions/checkout@v4
        with:
          repository: mk-josias/laravel-microservices
          path: laravel-microservices

      - name: Journey
        working-directory: distributable/starter
        run: tests/e2e/together-or-apart.sh ${{ matrix.compose }}
